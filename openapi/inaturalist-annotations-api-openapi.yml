openapi: 3.2.0
info:
  title: iNaturalist Annotations API
  description: '# https://api.inaturalist.org/v1/


    iNaturalist is a global community of

    naturalists, scientists, and members of the public sharing over a million

    wildlife sightings to teach one another about the natural world while

    creating high quality citizen science data for science and conservation.'
  version: 1.3.0
servers:
- url: /v1
tags:
- name: Annotations
  description: Create, delete, and vote
paths:
  /annotations:
    post:
      summary: Annotation Create
      description: Create an annotation
      tags:
      - Annotations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostAnnotation'
        description: Annotation object
      operationId: postAnnotations
      x-operation-id-source: derived
  /annotations/{id}:
    delete:
      summary: Annotation Delete
      description: Delete an annotation
      parameters:
      - $ref: '#/components/parameters/annotation_path_id'
      tags:
      - Annotations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: deleteAnnotationsById
      x-operation-id-source: derived
  /votes/vote/annotation/{id}:
    post:
      summary: Annotation Vote
      description: Vote on an annotation
      parameters:
      - $ref: '#/components/parameters/annotation_path_id'
      tags:
      - Annotations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVote'
        description: Vote object
      operationId: postVotesVoteAnnotationById
      x-operation-id-source: derived
  /votes/unvote/annotation/{id}:
    delete:
      summary: Annotation Unvote
      description: Remove a vote from annotation
      parameters:
      - $ref: '#/components/parameters/annotation_path_id'
      tags:
      - Annotations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: deleteVotesUnvoteAnnotationById
      x-operation-id-source: derived
components:
  parameters:
    annotation_path_id:
      name: id
      in: path
      required: true
      description: ID or UUID of the annotation
      schema:
        type: string
  schemas:
    PostAnnotation:
      type: object
      properties:
        annotation:
          type: object
          properties:
            resource_type:
              type: string
              enum:
              - Observation
            resource_id:
              type: integer
            controlled_attribute_id:
              type: integer
            controlled_value_id:
              type: integer
    PostVote:
      type: object
      properties:
        vote:
          type: string
          enum:
          - up
          - down
  securitySchemes:
    api_token:
      type: apiKey
      name: Authorization
      in: header
