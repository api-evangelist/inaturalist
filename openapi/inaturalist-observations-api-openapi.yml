openapi: 3.2.0
info:
  title: iNaturalist Observations API
  description: '# https://api.inaturalist.org/v1/


    iNaturalist is a global community of

    naturalists, scientists, and members of the public sharing over a million

    wildlife sightings to teach one another about the natural world while

    creating high quality citizen science data for science and conservation.'
  version: 1.3.0
servers:
- url: /v1
tags:
- name: Observations
  description: CRUD, search, faving, quality metrics, stats, and more
paths:
  /observations/{id}:
    get:
      summary: Observation Details
      description: 'Given an ID, or an array of IDs in comma-delimited format, returns

        corresponding observations. A maximum of 200 results will be returned'
      parameters:
      - $ref: '#/components/parameters/path_multi_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: 'Returns an object with metadata and an array of observations

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationsShowResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: getObservationsById
      x-operation-id-source: derived
    put:
      summary: Observation Update
      description: Update an observation
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostObservation'
        description: Comment object
      operationId: putObservationsById
      x-operation-id-source: derived
    delete:
      summary: Observation Delete
      description: Delete an observation
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: deleteObservationsById
      x-operation-id-source: derived
  /observations/{id}/fave:
    post:
      summary: Observations Fave
      description: Fave an observation
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: postObservationsByIdFave
      x-operation-id-source: derived
  /observations/{id}/unfave:
    delete:
      summary: Observations Unfave
      description: Unfave an observation
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: deleteObservationsByIdUnfave
      x-operation-id-source: derived
  /observations/{id}/review:
    post:
      summary: Observations Review
      description: Review an observation
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: postObservationsByIdReview
      x-operation-id-source: derived
    delete:
      summary: Observations Unreview
      description: Unreview an observation
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: deleteObservationsByIdReview
      x-operation-id-source: derived
  /observations/{id}/subscriptions:
    get:
      summary: Observation Subscriptions
      description: 'Fetches any subscriptions the current user has to this observation

        or the observer'
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: getObservationsByIdSubscriptions
      x-operation-id-source: derived
  /observations/{id}/quality/{metric}:
    post:
      summary: Quality Metric Set
      description: Set the value of a quality metric
      parameters:
      - $ref: '#/components/parameters/path_id'
      - $ref: '#/components/parameters/path_metric'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostQuality'
        description: Quality object
      operationId: postObservationsByIdQualityByMetric
      x-operation-id-source: derived
    delete:
      summary: Quality Metric Delete
      description: Delete a quality metric
      parameters:
      - $ref: '#/components/parameters/path_id'
      - $ref: '#/components/parameters/path_metric'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: deleteObservationsByIdQualityByMetric
      x-operation-id-source: derived
  /observations/{id}/taxon_summary:
    get:
      summary: Observation Taxon Summary
      description: 'Fetches information about this observation''s taxon, within the context

        of this observation''s location'
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      responses:
        '200':
          description: OK
      operationId: getObservationsByIdTaxonSummary
      x-operation-id-source: derived
  /subscriptions/observation/{id}/subscribe:
    post:
      summary: Observation Subscribe
      description: 'Toggles current user''s subscription to this observation. If the logged-in

        user is not subscribed, POSTing here will subscribe them. If they are already

        subscribed, this will remove the subscription'
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: postSubscriptionsObservationByIdSubscribe
      x-operation-id-source: derived
  /votes/vote/observation/{id}:
    post:
      summary: Observation Vote
      description: 'Vote on an observation. A vote with an empty `scope` is recorded as a

        `fave` of the observation. A vote with scope `needs_id` is recorded as a

        vote on the Quality Grade criterion "can the Community ID still be

        confirmed or improved?", and can be an up or down vote'
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostObservationVote'
        description: Vote object
      operationId: postVotesVoteObservationById
      x-operation-id-source: derived
  /votes/unvote/observation/{id}:
    delete:
      summary: Observation Unvote
      description: Remove a vote from an observation
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observations
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostObservationVote'
        description: Vote object
      operationId: deleteVotesUnvoteObservationById
      x-operation-id-source: derived
