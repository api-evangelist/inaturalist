  schemas:
    ObservationsResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - required:
        - results
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/Observation'
    Identification:
      type: object
      properties:
        id:
          type: integer
        observation_id:
          type: integer
        body:
          type: string
        category:
          type: string
          enum:
          - improving
          - leading
          - maverick
          - supporting
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        current:
          type: boolean
        taxon:
          $ref: '#/components/schemas/ObservationTaxon'
        previous_observation_taxon:
          $ref: '#/components/schemas/ObservationTaxon'
        user:
          $ref: '#/components/schemas/User'
        uuid:
          type: string
        created_at_details:
          $ref: '#/components/schemas/DateDetails'
        flags:
          type: array
          items:
            $ref: '#/components/schemas/Flag'
        own_observation:
          type: boolean
        taxon_change:
          type: object
          properties:
            id:
              type: integer
            type:
              type: string
        vision:
          type: boolean
        disagreement:
          type: boolean
        previous_observation_taxon_id:
          type: integer
        spam:
          type: boolean
        hidden:
          type: boolean
        moderator_actions:
          type: array
          items:
            $ref: '#/components/schemas/ModeratorAction'
    Color:
      type: object
      properties:
        id:
          type: integer
        value:
          type: string
    PostObservation:
      type: object
      properties:
        observation:
          type: object
          properties:
            species_guess:
              type: string
            taxon_id:
              type: integer
            description:
              type: string
    SpeciesCountsResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - required:
        - results
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                count:
                  type: integer
                taxon:
                  $ref: '#/components/schemas/ShowTaxon'
    PostObservationVote:
      type: object
      properties:
        vote:
          type: string
          enum:
          - up
          - down
        scope:
          enum:
          - needs_id
    RawConservationStatus:
      type: object
      properties:
        source_id:
          type: integer
          description: 'Identifier for the iNat source record associated with this status,

            retrievable via https://www.inaturalist.org/sources/:id.json

            (this endpoint is not a part of our public API and is thus subject to

            change or removal)

            '
        authority:
          type: string
          description: 'Organization that declared this status

            '
        status:
          type: string
          description: 'Body of the status, often coded, particularly when the status comes

            from the IUCN or NatureServe. Consult the authority and/or the

            status URL for details about the meanings of codes.

            '
        status_name:
          type: string
          description: 'Human-readable name of the status if it was coded.

            '
        iucn:
          type: integer
          description: 'Coded value representing the equivalent IUCN status. Mappings:

            NOT_EVALUATED = 0, DATA_DEFICIENT = 5, LEAST_CONCERN = 10,

            NEAR_THREATENED = 20, VULNERABLE = 30, ENDANGERED = 40,

            CRITICALLY_ENDANGERED = 50, EXTINCT_IN_THE_WILD = 60, EXTINCT = 70

            '
        geoprivacy:
          type: string
          description: 'Default geoprivacy for observations of this taxon in the status''s place.

            '
    ObservationPhoto:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
        photo:
          $ref: '#/components/schemas/Photo'
        position:
          type: integer
    ObservationsShowResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - required:
        - results
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/ShowObservation'
    NonOwnerIdentification:
      type: object
      properties:
        id:
          type: integer
        body:
          type: string
        created_at:
          type: string
          format: date-time
        created_at_details:
          $ref: '#/components/schemas/DateDetails'
        user:
          $ref: '#/components/schemas/User'
    PostQuality:
      type: object
      properties:
        agree:
          type: boolean
    Outlink:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
        url:
          type: string
    ShowTaxon:
      allOf:
      - $ref: '#/components/schemas/CoreTaxon'
      - type: object
        properties:
          ancestor_ids:
            type: array
            items:
              type: integer
          colors:
            type: array
            items:
              $ref: '#/components/schemas/Color'
          conservation_status:
            $ref: '#/components/schemas/ConservationStatus'
          conservation_statuses:
