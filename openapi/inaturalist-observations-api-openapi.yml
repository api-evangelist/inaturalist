components:
  parameters:
    date_field:
      name: date_field
      in: query
      required: false
      description: 'Histogram basis: when the observation was created or observed

        '
      schema:
        type: string
        enum:
        - created
        - observed
        default: observed
    fails_dqa_location:
      name: fails_dqa_location
      in: query
      description: Must be voted as not having an accurate location
      schema:
        type: boolean
    not_id:
      name: not_id
      in: query
      description: Must not have this ID
      schema:
        type: array
        items:
          type: string
        minimum: 1
    id_please:
      name: id_please
      in: query
      description: Observations with the deprecated `ID, Please!` flag. Note that this will return observations, but that this attribute is no longer used.
      schema:
        type: boolean
    swlng:
      name: swlng
      in: query
      description: 'Must be within this bounding box (*nelat, *nelng, *swlat, *swlng)

        '
      schema:
        type: number
        format: double
    not_matching_project_rules_for:
      name: not_matching_project_rules_for
      in: query
      description: Must not match the rules of the project with this ID or slug
      schema:
        type: string
    path_multi_id:
      name: id
      in: path
      required: true
      description: Must have this ID
      schema:
        type: array
        items:
          type: integer
    nelng:
      name: nelng
      in: query
      description: 'Must be within this bounding box (*nelat, *nelng, *swlat, *swlng)

        '
      schema:
        type: number
        format: double
    d2:
      name: d2
      in: query
      description: Must be observed on or before this date
      schema:
        type: string
        format: date
    geo:
      name: geo
      in: query
      description: Observations that are georeferenced
      schema:
        type: boolean
    acc_below:
      name: acc_below
      in: query
      description: Must have a positional accuracy below this value (meters)
      schema:
        type: string
    geoprivacy:
      name: geoprivacy
      in: query
      description: Must have this geoprivacy setting
      schema:
        type: array
        items:
          type: string
        enum:
        - obscured
        - obscured_private
        - open
        - private
    nelat:
      name: nelat
      in: query
      description: 'Must be within this bounding box (*nelat, *nelng, *swlat, *swlng)

        '
      schema:
        type: number
        format: double
    per_page:
      name: per_page
      in: query
      description: 'Number of results to return in a `page`. The maximum value is generally

        200 unless otherwise noted

        '
      schema:
        type: string
    captive:
      name: captive
      in: query
      description: Captive or cultivated observations
      schema:
        type: boolean
    user_login:
      name: user_login
      in: query
      description: User must have this login
      schema:
        type: array
        items:
          type: string
    place_id:
      name: place_id
      in: query
      description: Must be observed within the place with this ID
      schema:
        type: array
        items:
          type: integer
    license:
      name: license
      in: query
      description: Observation must have this license
      schema:
        type: array
        items:
          type: string
        enum:
        - cc-by
        - cc-by-nc
        - cc-by-nd
        - cc-by-sa
        - cc-by-nc-nd
        - cc-by-nc-sa
        - cc0
    fails_dqa_subject:
      name: fails_dqa_subject
      in: query
      description: Must be voted as not having evidence related to a single subject
      schema:
        type: boolean
    created_month:
      name: created_month
      in: query
      description: Must be created within this month
      schema:
        type: array
        items:
          type: string
        maximum: 12
        minimum: 1
    iconic_taxa:
      name: iconic_taxa
      in: query
      description: Taxon must by within this iconic taxon
      schema:
        type: array
        items:
          type: string
        enum:
        - Actinopterygii
        - Animalia
        - Amphibia
        - Arachnida
        - Aves
        - Chromista
        - Fungi
        - Insecta
        - Mammalia
