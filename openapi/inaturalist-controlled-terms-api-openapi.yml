openapi: 3.2.0
info:
  title: iNaturalist Controlled Terms API
  description: '# https://api.inaturalist.org/v1/


    iNaturalist is a global community of

    naturalists, scientists, and members of the public sharing over a million

    wildlife sightings to teach one another about the natural world while

    creating high quality citizen science data for science and conservation.'
  version: 1.3.0
servers:
- url: /v1
tags:
- name: Controlled Terms
  description: Search and fetch
paths:
  /controlled_terms:
    get:
      summary: Terms Index
      description: List all attribute controlled terms
      tags:
      - Controlled Terms
      responses:
        '200':
          description: OK
      operationId: getControlledTerms
      x-operation-id-source: derived
  /controlled_terms/for_taxon:
    get:
      summary: Terms for Taxon
      description: Returns attribute controlled terms relevant to a taxon
      parameters:
      - name: taxon_id
        in: query
        description: Filter by this taxon
        required: true
        schema:
          type: integer
          minimum: 1
      tags:
      - Controlled Terms
      responses:
        '200':
          description: OK
      operationId: getControlledTermsForTaxon
      x-operation-id-source: derived
components:
  securitySchemes:
    api_token:
      type: apiKey
      name: Authorization
      in: header
