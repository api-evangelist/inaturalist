openapi: 3.2.0
info:
  title: iNaturalist Observation Field Values API
  description: '# https://api.inaturalist.org/v1/


    iNaturalist is a global community of

    naturalists, scientists, and members of the public sharing over a million

    wildlife sightings to teach one another about the natural world while

    creating high quality citizen science data for science and conservation.'
  version: 1.3.0
servers:
- url: /v1
tags:
- name: Observation Field Values
  description: Create, update, and delete
paths:
  /observation_field_values/{id}:
    put:
      summary: Observation Field Value Update
      description: Update an observation field value
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observation Field Values
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostObservationFieldValue'
        description: Observation field value object
      operationId: putObservationFieldValuesById
      x-operation-id-source: derived
    delete:
      summary: Observation Field Value Delete
      description: Delete an observation field value
      parameters:
      - $ref: '#/components/parameters/path_id'
      tags:
      - Observation Field Values
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      operationId: deleteObservationFieldValuesById
      x-operation-id-source: derived
  /observation_field_values:
    post:
      summary: Observation Field Value Create
      description: Create an observation field value
      tags:
      - Observation Field Values
      security:
      - api_token: []
      responses:
        '200':
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostObservationFieldValue'
        description: Observation field value object
      operationId: postObservationFieldValues
      x-operation-id-source: derived
components:
  parameters:
    path_id:
      name: id
      in: path
      required: true
      description: ID of the record
      schema:
        type: integer
  schemas:
    PostObservationFieldValue:
      type: object
      properties:
        observation_field_value:
          type: object
          properties:
            observation_id:
              type: integer
            observation_field_id:
              type: integer
            value:
              type: string
  securitySchemes:
    api_token:
      type: apiKey
      name: Authorization
      in: header
