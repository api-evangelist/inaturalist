openapi: 3.2.0
info:
  title: iNaturalist Search API
  description: '# https://api.inaturalist.org/v1/


    iNaturalist is a global community of

    naturalists, scientists, and members of the public sharing over a million

    wildlife sightings to teach one another about the natural world while

    creating high quality citizen science data for science and conservation.'
  version: 1.3.0
servers:
- url: /v1
tags:
- name: Search
  description: Site search
paths:
  /search:
    get:
      summary: Site Search
      description: Given zero to many of following parameters, returns object matching the search criteria
      parameters:
      - $ref: '#/components/parameters/search_q'
      - $ref: '#/components/parameters/sources'
      - $ref: '#/components/parameters/associated_place_id'
      - $ref: '#/components/parameters/include_taxon_ancestors'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/locale'
      - $ref: '#/components/parameters/preferred_place_id'
      tags:
      - Search
      responses:
        '200':
          description: OK
      operationId: getSearch
      x-operation-id-source: derived
components:
  parameters:
    associated_place_id:
      name: place_id
      in: query
      description: Must be associated with this place
      schema:
        type: array
        items:
          type: string
    include_taxon_ancestors:
      name: include_taxon_ancestors
      in: query
      description: Include taxon ancestors in the response
      schema:
        type: boolean
        default: false
    preferred_place_id:
      name: preferred_place_id
      in: query
      description: 'Place preference for regional taxon common names

        '
      schema:
        type: integer
    search_q:
      name: q
      in: query
      description: Search object properties
      schema:
        type: string
    per_page:
      name: per_page
      in: query
      description: 'Number of results to return in a `page`. The maximum value is generally

        200 unless otherwise noted

        '
      schema:
        type: string
    sources:
      name: sources
      in: query
      description: Must be of this type
      schema:
        type: array
        items:
          type: string
        enum:
        - places
        - projects
        - taxa
        - users
    locale:
      name: locale
      in: query
      description: 'Locale preference for taxon common names

        '
      schema:
        type: string
  securitySchemes:
    api_token:
      type: apiKey
      name: Authorization
      in: header
