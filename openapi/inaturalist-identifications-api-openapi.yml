      in: query
      description: Must have an ID above this value
      schema:
        type: string
    taxon_name:
      name: taxon_name
      in: query
      description: 'Taxon must have a scientific or common name matching this string

        '
      schema:
        type: array
        items:
          type: string
    csi:
      name: csi
      in: query
      description: 'Taxon must have this IUCN conservation status. If

        the `place_id` parameter is also specified, this will only consider

        statuses specific to that place

        '
      schema:
        type: array
        items:
          type: string
        enum:
        - LC
        - NT
        - VU
        - EN
        - CR
        - EW
        - EX
    ids_category:
      name: category
      in: query
      description: Type of identification
      schema:
        type: array
        items:
          type: string
        enum:
        - improving
        - supporting
        - leading
        - maverick
    id:
      name: id
      in: query
      description: Must have this ID
      schema:
        type: array
        items:
          type: string
        minimum: 1
    ids_id:
      name: id
      in: query
      description: Identification ID
      schema:
        type: array
        items:
          type: integer
    sound_license:
      name: sound_license
      in: query
      description: Must have at least one sound with this license
      schema:
        type: array
        items:
          type: string
        enum:
        - cc-by
        - cc-by-nc
        - cc-by-nd
        - cc-by-sa
        - cc-by-nc-nd
        - cc-by-nc-sa
        - cc0
    without_term_value_id:
      name: without_term_value_id
      in: query
      description: 'Exclude observations with annotations using this controlled value ID.

        Must be combined with the `term_id` parameter

        '
      schema:
        type: array
        items:
          type: integer
    ids_place_id:
      name: place_id
      in: query
      description: Observation must occur in this place
      schema:
        type: array
        items:
          type: string
    hour:
      name: hour
      in: query
      description: Must be observed within this hour of the day
      schema:
        type: array
        items:
          type: string
        maximum: 23
        minimum: 0
    ids_observation_iconic_taxon_id:
      name: observation_iconic_taxon_id
      in: query
      description: Observation iconic taxon ID
      schema:
        type: array
        items:
          type: string
        minimum: 1
    ids_own_observation:
      name: own_observation
      in: query
      description: ID was added by the observer
      schema:
        type: boolean
    fails_dqa_evidence:
      name: fails_dqa_evidence
      in: query
      description: Must be voted as not evidence of an organism
      schema:
        type: boolean
    ids_observed_d2:
      name: observed_d2
      in: query
      description: Observation observed on or before this date
      schema:
        type: string
        format: date
    quality_grade:
      name: quality_grade
      in: query
      description: Must have this quality grade
      schema:
        type: string
        enum:
        - casual
        - needs_id
        - research
    ids_d1:
      name: d1
      in: query
      description: ID created on or after this time
      schema:
        type: string
        format: date
    pcid:
      name: pcid
      in: query
      description: 'Observations identified by the curator of a project. If

        the `project_id` parameter is also specified, this will only consider

        observations identified by curators of the specified project(s)

        '
      schema:
        type: boolean
    photos:
      name: photos
      in: query
      description: Observations with photos
      schema:
        type: boolean
    identifications:
      name: identifications
      in: query
      description: Identifications must meet these criteria
      schema:
        type: string
        enum:
        - most_agree
        - most_disagree
        - some_agree
    reviewed:
      name: reviewed
      in: query
      description: 'Observations have been reviewed by the user with ID equal to

        the value of the `viewer_id` parameter

        '
      schema:
        type: boolean
    site_id:
      name: site_id
      in: query
      description: 'Must be affiliated with the iNaturalist network website with this ID

        '
      schema:
        type: array
        items:
          type: string
    fails_dqa_recent:
      name: fails_dqa_recent
      in: query
      description: Must be voted as not recent evidence of an organism
      schema:
        type: boolean
    without_taxon_id:
      name: without_taxon_id
      in: query
      description: Exclude observations of these taxa and their descendants
      schema:
        type: array
        items:
          type: string
        minimum: 1
    ids_observed_d1:
      name: observed_d1
      in: query
      description: Observation observed on or after this date
      schema:
        type: string
        format: date
  schemas:
    Color:
      type: object
      properties:
        id:
          type: integer
        value:
          type: string
    SpeciesCountsResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - required:
        - results
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                count:
                  type: integer
                taxon:
                  $ref: '#/components/schemas/ShowTaxon'
    RawConservationStatus:
      type: object
      properties:
        source_id:
          type: integer
          description: 'Identifier for the iNat source record associated with this status,

            retrievable via https://www.inaturalist.org/sources/:id.json

            (this endpoint is not a part of our public API and is thus subject to

            change or removal)

            '
        authority:
          type: string
          description: 'Organization that declared this status

            '
        status:
          type: string
          description: 'Body of the status, often coded, particularly when the status comes

            from the IUCN or NatureServe. Consult the authority and/or the

            status URL for details about the meanings of codes.

            '
        status_name:
          type: string
          description: 'Human-readable name of the status if it was coded.

            '
        iucn:
          type: integer
          description: 'Coded value representing the equivalent IUCN status. Mappings:

            NOT_EVALUATED = 0, DATA_DEFICIENT = 5, LEAST_CONCERN = 10,

            NEAR_THREATENED = 20, VULNERABLE = 30, ENDANGERED = 40,

            CRITICALLY_ENDANGERED = 50, EXTINCT_IN_THE_WILD = 60, EXTINCT = 70

            '
        geoprivacy:
          type: string
          description: 'Default geoprivacy for observations of this taxon in the status''s place.

            '
    ShowTaxon:
      allOf:
      - $ref: '#/components/schemas/CoreTaxon'
      - type: object
        properties:
          ancestor_ids:
            type: array
            items:
              type: integer
          colors:
            type: array
            items:
              $ref: '#/components/schemas/Color'
          conservation_status:
            $ref: '#/components/schemas/ConservationStatus'
          conservation_statuses:
            type: array
            items:
              $ref: '#/components/schemas/TaxonConservationStatus'
          default_photo:
            $ref: '#/components/schemas/TaxonPhoto'
          establishment_means:
            $ref: '#/components/schemas/EstablishmentMeans'
          observations_count:
            type: integer
          preferred_establishment_means:
            type: string
    TaxonPhoto:
      allOf:
      - $ref: '#/components/schemas/Photo'
      - type: object
        properties:
          medium_url:
            type: string
          square_url:
            type: string
    Error:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
    User:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: integer
        icon:
          type: string
        icon_url:
          type: string
        identifications_count:
          type: integer
        journal_posts_count:
          type: integer
        login:
          type: string
        name:
          type: string
        observations_count:
          type: integer
        orcid:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - admin
            - app owner
            - curator
        site_id:
          type: integer
        species_count:
          type: integer
        spam:
          type: boolean
        suspended:
          type: boolean
    PostIdentification:
      type: object
      properties:
        identification:
          type: object
          properties:
            observation_id:
              type: integer
            taxon_id:
              type: integer
            current:
              type: boolean
            body:
              type: string
    ConservationStatus:
      type: object
      properties:
        place_id:
          type: integer
        place:
          $ref: '#/components/schemas/CorePlace'
        status:
          type: string
    BaseResponse:
      type: object
      properties:
        total_results:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
    EstablishmentMeans:
      type: object
      properties:
        establishment_means:
          type: string
        place:
          $ref: '#/components/schemas/CorePlace'
    TaxonConservationStatus:
      allOf:
      - $ref: '#/components/schemas/RawConservationStatus'
      - type: object
        properties:
          place:
            $ref: '#/components/schemas/CorePlace'
    CoreTaxon:
      type: object
      properties:
        id:
          type: integer
        iconic_taxon_id:
          type: integer
        iconic_taxon_name:
          type: string
        is_active:
          type: boolean
        name:
          type: string
        preferred_common_name:
          type: string
        rank:
          type: string
        rank_level:
          type: number
    CorePlace:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        display_name:
          type: string
    UserCountsResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - required:
        - results
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                count:
                  type: integer
                user:
                  $ref: '#/components/schemas/User'
    Photo:
      type: object
      properties:
        id:
          type: integer
        attribution:
          type: string
        license_code:
          type: string
        url:
          type: string
  securitySchemes:
    api_token:
      type: apiKey
      name: Authorization
      in: header
